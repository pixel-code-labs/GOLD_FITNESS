name: Gold Fitness Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Project Files
        run: |
          mkdir -p dist
          zip -r dist/GOLD_FITNESS-${{ github.ref_name }}.zip index.html css/ js/ README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GOLD_FITNESS-${{ github.ref_name }}.zip
          name: Gold Fitness Release ${{ github.ref_name }}
          body: |
            ## 🚀 Gold Fitness Web Application (${{ github.ref_name }})
            
            ### Package Highlights:
            - **Interactive Multi-Branch Schedule**: Dynamic JavaScript state switcher.
            - **SEO & Schema Data**: Google Maps local indexing and `ExerciseGym` JSON-LD integrated.
            - **Responsive UI/UX**: Premium metallic gold aesthetic built for mobile, tablet, and desktop.
            
            *Automated release build generated by Pixel Code Labs CI/CD pipeline.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}